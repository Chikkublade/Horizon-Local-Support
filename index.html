<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Horizon Local Support</title>
    <meta
      name="description"
      content="Horizon Local Support landing page inspired by a pixel-art night sky design."
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="scene">
      <div class="stars stars-1"></div>
      <div class="stars stars-2"></div>
      <div class="stars stars-3"></div>

      <div class="cloud cloud-left"></div>
      <div class="cloud cloud-right"></div>

      <main class="hero">
        <h1>Horizon</h1>
        <div class="subtitle-wrap">
          <span class="line left"></span>
          <h2>Local Support</h2>
          <span class="line right"></span>
        </div>
      </main>

      <div class="sun-glow"></div>
      <div class="sun"></div>

      <div class="horizon-layer layer-back"></div>
      <div class="horizon-layer layer-mid"></div>
      <div class="horizon-layer layer-front"></div>
    </div>
  </body>
</html>
